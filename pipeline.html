  <!-- MODAL: Create/Edit Lead -->
  <div class="modal-overlay" id="modal-lead-create" role="dialog" aria-label="Criar novo lead" aria-modal="true" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal" id="modal-lead-create-panel">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-lead-title">Novo Lead</h2>
        <button class="modal-close-btn" data-close-modal aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form class="modal-form" id="form-lead-create" novalidate autocomplete="off">
        <input type="hidden" id="lf-lead-id" name="leadId" />
        <div class="form-section">
          <span class="form-section-label">Contato</span>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="lf-first-name">Nome <span class="required">*</span></label><input type="text" class="form-input" id="lf-first-name" name="firstName" placeholder="Bruno" required /></div>
            <div class="form-group"><label class="form-label" for="lf-last-name">Sobrenome <span class="required">*</span></label><input type="text" class="form-input" id="lf-last-name" name="lastName" placeholder="Alves" required /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="lf-role">Cargo</label><input type="text" class="form-input" id="lf-role" name="role" placeholder="CEO…" /></div>
            <div class="form-group"><label class="form-label" for="lf-email">E-mail <span class="required">*</span></label><input type="email" class="form-input" id="lf-email" name="email" placeholder="nome@empresa.com.br" required /></div>
          </div>
        </div>
        <div class="form-section">
          <span class="form-section-label">Empresa</span>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="lf-company">Empresa <span class="required">*</span></label><input type="text" class="form-input" id="lf-company" name="company" placeholder="Nome da empresa" required /></div>
            <div class="form-group"><label class="form-label" for="lf-segment">Segmento</label><input type="text" class="form-input" id="lf-segment" name="segment" placeholder="SaaS B2B…" /></div>
          </div>
        </div>
        <div class="form-section">
          <span class="form-section-label">Oportunidade</span>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="lf-deal-value">Valor (R$)</label><input type="number" class="form-input" id="lf-deal-value" name="dealValue" placeholder="0" min="0" /></div>
            <div class="form-group"><label class="form-label" for="lf-stage">Estágio</label>
              <select class="form-select" id="lf-stage" name="stage">
                <option value="new">Novo Lead</option><option value="qualified">Qualificado</option>
                <option value="proposal">Proposta Enviada</option><option value="negotiation">Negociação</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="lf-source">Origem</label>
              <select class="form-select" id="lf-source" name="source">
                <option value="">— Selecione —</option><option value="Indicação">Indicação</option>
                <option value="LinkedIn">LinkedIn</option><option value="Site Orgânico">Site Orgânico</option>
                <option value="Outbound SDR">Outbound SDR</option><option value="Evento / Webinar">Evento / Webinar</option>
                <option value="Google Ads">Google Ads</option><option value="Cold Email">Cold Email</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label" for="lf-closing-date">Previsão Fechamento</label><input type="date" class="form-input" id="lf-closing-date" name="closingDate" /></div>
          </div>
          <div class="form-group"><label class="form-label" for="lf-notes">Notas</label><textarea class="form-textarea" id="lf-notes" name="notes" rows="2" placeholder="Contexto do lead…"></textarea></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-save-lead">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            Salvar Lead
          </button>
        </div>
      </form>
    </div>
