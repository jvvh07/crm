    <!-- MAIN -->
    <div class="main-wrap" id="main-wrap">

      <header class="topbar" id="topbar" role="banner">
        <div class="topbar-left">
          <button class="topbar-menu-btn" id="topbar-menu-btn" aria-label="Abrir menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="topbar-breadcrumb">
            <span class="breadcrumb-item breadcrumb-root">IBEX</span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item breadcrumb-current">Equipe</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="topbar-search-btn" id="topbar-search-btn" aria-label="Buscar (Ctrl+K)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span class="topbar-search-label">Buscar…</span>
            <kbd class="topbar-kbd">⌘K</kbd>
          </button>
          <button class="btn btn-primary btn-sm" id="team-add-member-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Adicionar Colaborador
          </button>
          <button class="topbar-icon-btn" id="notifications-btn" aria-label="Notificações">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="topbar-badge" id="notif-badge">3</span>
          </button>
          <button class="topbar-avatar-btn" id="topbar-avatar-btn" aria-label="Perfil">
            <div class="topbar-avatar" id="topbar-avatar">JH</div>
          </button>
        </div>
      </header>

      <!-- TEAM PAGE -->
      <main class="team-page" id="team-page" role="main">

        <div class="team-header">
          <div>
            <h1 class="page-title">Equipe</h1>
            <p class="team-header-sub">Departamentos, colaboradores, cargos e indicadores de desempenho.</p>
          </div>
          <div class="team-header-stats" id="team-header-stats">
            <!-- injetado via JS: total de colaboradores, ativos, departamentos -->
          </div>
        </div>

        <!-- GRID DE DEPARTAMENTOS -->
        <div class="team-dept-grid" id="team-dept-grid" role="tablist" aria-label="Filtrar por departamento">
          <!-- injetado via JS -->
        </div>

        <!-- BARRA DE BUSCA -->
        <div class="team-search-bar">
          <div class="team-search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" class="team-search-input" id="team-search-input" placeholder="Buscar colaborador…" aria-label="Buscar colaborador" />
          </div>
          <div class="view-toggle" id="team-view-toggle" role="group" aria-label="Alternar visualização">
            <button class="view-toggle-btn active" data-view="grid" aria-label="Visualização em grade">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            <button class="view-toggle-btn" data-view="list" aria-label="Visualização em lista">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
        </div>

        <!-- GRID/LISTA DE COLABORADORES -->
        <div class="team-members-container" id="team-members-container">
          <!-- injetado via JS -->
        </div>

      </main>
    </div>
  </div>

  <!-- DRAWER: Perfil do Colaborador -->
  <div class="drawer-overlay" id="team-drawer-overlay" hidden></div>
  <aside class="lead-drawer team-drawer" id="team-drawer" role="dialog" aria-modal="true" aria-label="Perfil do colaborador" hidden>

      <div class="drawer-header">
        <div class="drawer-avatar" id="team-drawer-avatar">JH</div>
        <div style="flex:1;min-width:0">
          <div class="drawer-lead-name" id="team-drawer-name">—</div>
          <div class="drawer-lead-role" id="team-drawer-role">—</div>
        </div>
        <button class="drawer-close-btn" data-close-drawer aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="drawer-tabs" role="tablist">
        <button class="drawer-tab active" data-tab="profile" role="tab">Perfil</button>
        <button class="drawer-tab" data-tab="permissions" role="tab">Permissões</button>
        <button class="drawer-tab" data-tab="kpis" role="tab">Indicadores</button>
      </div>

      <div class="drawer-body" id="team-drawer-body">
        <!-- injetado via JS conforme aba ativa -->
      </div>

    </aside>

  <!-- MODAL: Novo Colaborador -->
  <div class="modal-overlay" id="team-modal-new-member" role="dialog" aria-label="Adicionar colaborador" aria-modal="true" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal" id="team-modal-panel" style="max-width:480px">
      <div class="modal-header">
        <h2 class="modal-title">Adicionar Colaborador</h2>
        <button class="modal-close-btn" data-close-modal aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form class="modal-form" id="team-new-member-form" novalidate autocomplete="off">
        <div class="form-section">
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="tm-name">Nome completo <span class="required">*</span></label><input type="text" class="form-input" id="tm-name" name="name" required /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="tm-role">Cargo <span class="required">*</span></label><input type="text" class="form-input" id="tm-role" name="role" required /></div>
            <div class="form-group">
              <label class="form-label" for="tm-department">Departamento <span class="required">*</span></label>
              <select class="form-select" id="tm-department" name="department" required></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="tm-email">E-mail <span class="required">*</span></label><input type="email" class="form-input" id="tm-email" name="email" required /></div>
            <div class="form-group"><label class="form-label" for="tm-phone">Telefone</label><input type="text" class="form-input" id="tm-phone" name="phone" placeholder="+55…" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="tm-quota">Meta mensal (R$)</label><input type="number" class="form-input" id="tm-quota" name="quota" min="0" step="1000" placeholder="0" /></div>
            <div class="form-group"><label class="form-label" for="tm-admission">Data de admissão</label><input type="date" class="form-input" id="tm-admission" name="admissionDate" /></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
          <button type="submit" class="btn btn-primary" id="team-save-member-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            Adicionar
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toast-container" role="region" aria-live="polite"></div>
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <!-- Search overlay (Ctrl+K) -->
  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-backdrop" id="search-backdrop"></div>
    <div class="search-panel">
      <div class="search-input-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="search-input" placeholder="Buscar leads, tarefas, páginas…" autocomplete="off" />
      </div>
      <div class="search-results" id="search-results"></div>
      <div class="search-footer"></div>
    </div>
  </div>

  <!-- 1. Utilitários -->
  <script src="js/utils.js"></script>
  <!-- 2. Camada de dados -->
  <script src="js/storage.js"></script>
  <!-- 3. Estado global -->
  <script src="js/state.js"></script>
  <script src="js/theme-engine-patch.js"></script>
  <!-- 4. Componentes de UI genéricos -->
  <script src="js/ui.js"></script>
  <!-- 5. App orchestrator -->
  <script src="js/app.js"></script>
  <!-- Componentes compartilhados (confirm dialog, avatar) -->
  <script src="js/components.js"></script>
  <!-- 6. Premium enhancements globais (context menu, confirm, atalhos) -->
  <script src="js/dashboard-premium.js"></script>
  <!-- Papéis e Permissões (fonte compartilhada) -->
  <script src="js/permissions-data.js"></script>
  <!-- Módulo de Equipe (esta página) -->
  <script src="js/team.js"></script>

</body>
